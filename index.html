    <style>
        html { scroll-behavior: smooth; }
        .text-shadow-lg { text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .mobile-menu-content { min-height: 100vh; display: flex; flex-direction: column; }
        .mobile-nav-links .nav-link-item { padding-top: 0.25rem; padding-bottom: 0.25rem; }

        /* ===== ANIMACIONES HERO ===== */

        /* Partículas de vapor / polvo de café */
        @keyframes float-particle {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            10% { opacity: 0.6; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-120px) translateX(var(--dx)) scale(0.3); opacity: 0; }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(228,184,130,0.5) 0%, transparent 70%);
            animation: float-particle var(--dur) ease-in infinite;
            animation-delay: var(--delay);
            width: var(--size);
            height: var(--size);
            pointer-events: none;
        }

        /* Brillo barrido horizontal sobre el logo */
        @keyframes shimmer {
            0% { transform: translateX(-100%) skewX(-20deg); }
            100% { transform: translateX(300%) skewX(-20deg); }
        }
        .logo-shimmer {
            position: relative;
            overflow: hidden;
        }
        .logo-shimmer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%);
            animation: shimmer 3.5s ease-in-out infinite;
            border-radius: 4px;
        }

        /* Fade-in + slide-up del logo */
        @keyframes hero-entrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .hero-logo-anim {
            animation: hero-entrance 1.2s cubic-bezier(0.22,1,0.36,1) forwards;
        }

        /* Pulso suave del logo (tras la entrada) */
        @keyframes pulse-white {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(240,240,240,0.7)); }
            50% { transform: scale(1.04); filter: drop-shadow(0 0 18px rgba(228,184,130,0.45)); }
        }
        .logo-pulse { animation: pulse-white 5s ease-in-out infinite 1.4s; }

        /* Línea dorada animada bajo el hero */
        @keyframes line-expand {
            0% { width: 0; opacity: 0; }
            100% { width: 80px; opacity: 1; }
        }
        .hero-line {
            animation: line-expand 1.4s cubic-bezier(0.22,1,0.36,1) 0.6s forwards;
            width: 0;
        }

        /* Texto welcome fade-in */
        @keyframes text-reveal {
            0% { opacity: 0; letter-spacing: 0.4em; }
            100% { opacity: 1; letter-spacing: 0.25em; }
        }
        .hero-text-anim {
            animation: text-reveal 2.0s ease-out 0.3s forwards;
            opacity: 0;
        }

        /* Año 1918 typing effect */
        @keyframes year-in {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 0.7; transform: translateY(0); }
        }
        .hero-year-anim {
            animation: year-in 1s ease-out 1.8s forwards;
            opacity: 0;
        }

        /* Overlay gradiente del hero */
        .hero-overlay {
            background: linear-gradient(
                to bottom,
                rgba(13,26,28,0.35) 0%,
                rgba(13,26,28,0.1) 40%,
                rgba(13,26,28,0.5) 100%
            );
        }

        /* ===== SCROLL REVEAL ===== */
        .reveal {
            opacity: 0;
            transform: translateY(32px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== CARDS MENÚ ===== */
        .menu-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            border: 1px solid transparent;
        }
        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 24px rgba(228,184,130,0.15);
            border-color: rgba(228,184,130,0.25);
        }

        /* ===== IMAGEN CATEGORÍA CON PARALLAX LEVE ===== */
        .category-img {
            transition: transform 0.6s ease;
            transform-origin: center;
        }
        .category-section:hover .category-img {
            transform: scale(1.03);
        }
        .category-img-wrap {
            overflow: hidden;
            border-radius: 0.5rem;
        }

        /* ===== TÍTULO CATEGORÍA CON HOVER GLOW ===== */
        .category-title {
            transition: text-shadow 0.4s ease;
        }
        .category-section:hover .category-title {
            text-shadow: 0 0 30px rgba(228,184,130,0.3);
        }

        /* ===== BOTONES FLOTANTES ===== */
        @keyframes pulse-green {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37,211,102,0.7); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(37,211,102,0); }
        }
        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,215,0,0.7); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255,215,0,0); }

        .review-pulse { animation: pulse-gold 4s infinite; }

        /* ===== NAV HIGHLIGHT BAR ===== */
        .nav-link-item {
            position: relative;
        }
        .nav-link-item::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: #e4b882;
            transition: width 0.3s ease;
            border-radius: 2px;
        }
        .nav-link-item:hover::after {
            width: 70%;
        }

        /* ===== HEADER SCROLL EFFECT ===== */

            box-shadow: 0 2px 20px rgba(0,0,0,0.4) !important;

        .price-glow {
            transition: text-shadow 0.3s ease;
        }
        .menu-card:hover .price-glow {
            text-shadow: 0 0 12px rgba(228,184,130,0.5);
        }

        /* ===== SEPARADOR DECORATIVO ===== */
        .ornament {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin: 12px 0;
        }
        .ornament-line {
            flex: 1;
            max-width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c49a62, transparent);
        }
        .ornament-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #e4b882;
            box-shadow: 0 0 6px rgba(228,184,130,0.5);
        }

        /* ===== CURSOR PERSONALIZADO ===== */
        * { cursor: none !important; }
        .custom-cursor {
            width: 12px;
            height: 12px;
            background: #e4b882;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease, width 0.2s ease, height 0.2s ease, background 0.2s ease;
            mix-blend-mode: difference;
        }
        .custom-cursor.hovering {
            width: 28px;
            height: 28px;
            background: rgba(228,184,130,0.4);
        }

        .footer-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(228,184,130,0.4), transparent);
            margin: 16px 0;
        }

        /* Ripple en botones */
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }
        .btn-ripple {
            position: relative;
            overflow: hidden;
        }
        .btn-ripple .ripple-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        /* Mobile menu transition */
        .mobile-panel {
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        .mobile-panel.open {
            transform: translateX(0);

            pointer-events: none;

            opacity: 0.3;
        }

    <script>
        // ===== MÚSICA (código original mantenido intacto) =====
        document.addEventListener("DOMContentLoaded", () => {
            const audio = document.getElementById("background-music");
            document.body.addEventListener("click", () => {
                if (audio.paused) {
                    audio.volume = 0;
                    audio.currentTime = 0;
                    audio.play();
                    const targetVolume = 0.02;
                    const fadeDuration = 2000;
                    const steps = 20;
                    let step = 0;
                    const fadeInterval = setInterval(() => {
                        step++;
                        audio.volume = (targetVolume / steps) * step;
                        if (step >= steps) clearInterval(fadeInterval);
                    }, fadeDuration / steps);
                }
            });
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "hidden") audio.pause();
            });
            window.addEventListener("blur", () => { audio.pause(); });
        });

        // ===== CURSOR PERSONALIZADO =====
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        document.addEventListener('mouseover', e => {
            if (e.target.matches('a, button, [role=button]')) {
                cursor.classList.add('hovering');
            } else {
                cursor.classList.remove('hovering');
            }
        });

        // ===== SCROLL REVEAL =====
        const observerReveal = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });

        // ===== HEADER SCROLL =====
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (header) {
                if (window.scrollY > 50) header.classList.add('header-scrolled');
                else header.classList.remove('header-scrolled');
            }
        });
    </script>
